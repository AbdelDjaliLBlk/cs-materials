<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exemple Bootstrap</title>
	
	<!-- avec connexion internet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	
	<!--  utilisation hors ligne -->
	<link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
	
</head>
<body class="bg-light text-center">

    <div class="container mt-5">
        <h1 class="text-primary">Bonjour, Bootstrap !</h1>
        <p class="lead">Ceci est un exemple simple d'utilisation de Bootstrap.</p>
        <img src="oranges.jpeg" class="img-fluid rounded shadow" alt="Exemple d'image">
        <br><br>
        <a href="#" class="btn btn-success">Cliquez ici</a>
    </div>

   <!-- avec connexion internet -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
   <!--  utilisation hors ligne -->
   <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!--
Réponse :
1- BootStrap est framework CSS qui a pour but de faciliter la création d'interfaces
2- CDN est réseau de serveurs qui permet de charger des fichiers directement d'Internet
3- * 'bg-light text-center': Centrer le texte avec un arriere-plan clair
   * 'container mt-5': 
   * 'text-primary': Texte ecrit comme titre (Gras , BLeu)
   * 'btn btn-success': Buuton vert avec un font blanc
   * 'lead' : texte claire
   * 'img-fluid rounded shadow' : marge de l'image ombre.
4 - Avantage:
  - Compatible avec differents navigateurs
  - Gagner du temps par rapport au CSS
  - Classe pretes a utiliser
  - Reponse Automatique
-->
