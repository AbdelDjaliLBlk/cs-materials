<script> 
 function somme1(a,b) {return a+b;} 
  let somme2 = (a,b) => a+b; 
  let f1 = (function return42() {return 42;}) (); 
  let f2 = (function () {return 300;}) (); 
  let f3 = ((x) => 30 * x) (30);

  let f6 = (() => "Informatique")(); 
  console.log(somme1(10,20)); 
  console.log(typeof somme2);

  console.log(f1);

 </script>
