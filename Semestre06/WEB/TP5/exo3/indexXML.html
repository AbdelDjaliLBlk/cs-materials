<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Recherche AJAX avec XMLHttpRequest</title>
</head>
<body>
  <h1>Recherche d'utilisateurs</h1>
  <input id="search" placeholder="Tapez un nom..." />
  <div id="results"></div>

  <script>
    const searchInput = document.getElementById('search');
    const resultsDiv = document.getElementById('results');

    searchInput.addEventListener('keyup', () => {
      const query = searchInput.value.trim();

      if (query === '') {
        resultsDiv.innerHTML = '';
        return;
      }

      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'search.php?query=' + encodeURIComponent(query), true);

      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          resultsDiv.innerHTML = xhr.responseText;
        }
      };

      xhr.send();
    });
  </script>
</body>
</html>
<!-- // keyup se déclenche après chaque frappe du clavier,
// ce qui signifie qu'une nouvelle requête HTTP est envoyée à search.php à chaque touche appuyée. 
//Les URLs ne peuvent pas contenir de caractères spéciaux comme
// les espaces, &, #, ?, les lettres accentuées (é, à, ü),
// etc. encodeURIComponent() les convertit en format URL-encodé sécurisé. -->
