<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f8f8;
        }
        fieldset {
            border: 2px solid red;
            padding: 15px;
            display: inline-block;
            background: white;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }
        legend {
            font-weight: bold;
            color: red;
        }
        label {
            font-weight: bold;
        }
        input[type="text"] {
            width: 100px;
            padding: 5px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="radio"], input[type="checkbox"] {
            margin-right: 5px;
        }
        button {
            background-color: red;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: darkred;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
    <script>
        function validateForm(event) {
            let x = document.forms["calcForm"]["x"].value;
            let y = document.forms["calcForm"]["y"].value;
            let op = document.querySelector('input[name="op"]:checked');

            if (x === "" || y === "" || op === null) {
                document.getElementById("error-msg").innerText = "Veuillez remplir tous les champs et choisir une opération.";
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <form name="calcForm" action="calculateur.php" method="post" onsubmit="return validateForm(event)">
        <fieldset>
            <legend>Opérations</legend>

            <label>X :</label>
            <input name="x"><br><br>

            <label>Y :</label>
            <input name="y"><br><br>

            <label>Opération :</label><br>
            <input type="radio" name="op" value="+">
            <label>( + )</label> <br>

            <input type="radio" name="op" value="-">
            <label>( - )</label> <br>

            <input type="radio" name="op" value="*">
            <label>( * )</label><br><br>

            <input type="checkbox" name="enregistrement">
            <label>Enregistrer le résultat</label><br><br>

            <p id="error-msg" class="error"></p>

            <button type="submit">Calculer</button>
        </fieldset>
    </form>
</body>
</html>
