<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exercice 5 - Facture</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    h1 { text-align: center; }
    table { border-collapse: collapse; width: 60%; margin: 20px auto; }
    th, td { border: 1px solid #333; padding: 8px 15px; text-align: center; }
    th { background-color: #4472C4; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    .summary { text-align: center; margin: 10px; font-weight: bold; }
    .buttons { text-align: center; margin: 20px; }
    button { padding: 8px 16px; margin: 5px; cursor: pointer; background-color: #4472C4; color: white; border: none; border-radius: 4px; }
    button:hover { background-color: #2a52a0; }

    @media print {
      .buttons { display: none; }
    }
  </style>
</head>
<body>
  <h1>Facture — <span id="dateJour"></span></h1>

  <table id="tableauFacture">
    <thead>
      <tr>
        <th>Article</th>
        <th>Prix Unitaire (DA)</th>
        <th>Quantité</th>
      </tr>
    </thead>
    <tbody>
      
    </tbody>
  </table>

  <div class="summary">
    <p>Nombre total d'articles achetés : <span id="totalArticles"></span></p>
    <p>Montant total à payer : <span id="totalMontant"></span> DA</p>
  </div>

  <div class="buttons">
    <button onclick="insererArticle()">Insertion</button>
    <button onclick="modifierArticle()">Modification</button>
    <button onclick="supprimerArticle()">Suppression</button>
    <button onclick="window.print()">Imprimer</button>
  </div>

  <script>
    var today = new Date();
    document.getElementById("dateJour").textContent =
      today.toLocaleDateString("fr-FR", { year: "numeric", month: "long", day: "numeric" });

    function mettreAJourResume() {
      var lignes = document.querySelectorAll("#tableauFacture tbody tr");
      var totalQte = 0;
      var totalMontant = 0;

      lignes.forEach(function (ligne) {
        var cells = ligne.querySelectorAll("td");
        var prix = parseFloat(cells[1].textContent);
        var qte = parseInt(cells[2].textContent);
        totalQte += qte;
        totalMontant += prix * qte;
      });

      document.getElementById("totalArticles").textContent = totalQte;
      document.getElementById("totalMontant").textContent = totalMontant.toLocaleString("fr-FR");
    }

    function articleExiste(nom) {
      var lignes = document.querySelectorAll("#tableauFacture tbody tr");
      for (var i = 0; i < lignes.length; i++) {
        if (lignes[i].querySelectorAll("td")[0].textContent.trim().toLowerCase() === nom.toLowerCase()) {
          return true;
        }
      }
      return false;
    }

    function insererArticle() {
      var nom = prompt("Nom de l'article :");
      if (!nom) return;

      if (articleExiste(nom)) {
        alert("L'article \"" + nom + "\" existe déjà dans la facture.");
        return;
      }

      var prix = parseFloat(prompt("Prix unitaire (DA) :"));
      if (isNaN(prix)) { alert("Prix invalide."); return; }

      var qte = parseInt(prompt("Quantité :"));
      if (isNaN(qte)) { alert("Quantité invalide."); return; }

      var tbody = document.querySelector("#tableauFacture tbody");
      var nouvelleLigne = document.createElement("tr");
      nouvelleLigne.innerHTML = "<td>" + nom + "</td><td>" + prix + "</td><td>" + qte + "</td>";
      tbody.appendChild(nouvelleLigne);

      mettreAJourResume();
    }

    function modifierArticle() {
      var nom = prompt("Nom de l'article à modifier :");
      if (!nom) return;

      var lignes = document.querySelectorAll("#tableauFacture tbody tr");
      var trouve = false;

      lignes.forEach(function (ligne) {
        var cells = ligne.querySelectorAll("td");
        if (cells[0].textContent.trim().toLowerCase() === nom.toLowerCase()) {
          var nouveauPrix = parseFloat(prompt("Nouveau prix unitaire (DA) :"));
          if (isNaN(nouveauPrix)) { alert("Prix invalide."); return; }
          var nouvelleQte = parseInt(prompt("Nouvelle quantité :"));
          if (isNaN(nouvelleQte)) { alert("Quantité invalide."); return; }

          cells[1].textContent = nouveauPrix;
          cells[2].textContent = nouvelleQte;
          trouve = true;
        }
      });

      if (!trouve) {
        alert("L'article \"" + nom + "\" n'existe pas dans la facture.");
      } else {
        mettreAJourResume();
      }
    }

    function supprimerArticle() {
      var nom = prompt("Nom de l'article à supprimer :");
      if (!nom) return;

      var lignes = document.querySelectorAll("#tableauFacture tbody tr");
      var trouve = false;

      lignes.forEach(function (ligne) {
        var cells = ligne.querySelectorAll("td");
        if (cells[0].textContent.trim().toLowerCase() === nom.toLowerCase()) {
          ligne.remove();
          trouve = true;
        }
      });

      if (!trouve) {
        alert("L'article \"" + nom + "\" n'existe pas dans la facture.");
      } else {
        mettreAJourResume();
      }
    }

    mettreAJourResume();
  </script>
</body>
</html>
